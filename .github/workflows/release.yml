name: Release

# Every push to main checks module.json's "version"; if no release exists for it yet, one is cut.
# Bump the version, push, and the Action tags vX.Y.Z, zips the module and publishes
# module.json + module.zip to the release. Pushing a v* tag by hand also works.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .version module.json)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v${{ steps.ver.outputs.version }} already exists — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version into module.json
        if: steps.exists.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg repo "$REPO" \
            '.version = $v
             | .url = $repo
             | .manifest = ($repo + "/releases/latest/download/module.json")
             | .download = ($repo + "/releases/download/v" + $v + "/module.zip")' \
            module.json > module.json.tmp && mv module.json.tmp module.json
          cat module.json

      - name: Zip module
        if: steps.exists.outputs.skip == 'false'
        run: zip -r module.zip module.json scripts templates styles lang data README.md

      - name: Publish release
        if: steps.exists.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          files: |
            module.json
            module.zip
          generate_release_notes: true
